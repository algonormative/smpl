[project]
name = "smpl-ask"
version = "0.1.0"
description = "smpl ask — an audio LLM as a second ear. Sends one clip or an A/B pair to Gemini (REST, no SDK) with one narrow question from a fixed bank, demands a JSON answer with timestamps, runs A/B in both orders, and emits `claim` text frames for `smpl crosscheck` to referee against smpl's own measurements. Also ships a known-answer calibration set (`smpl-ask calibrate`). Never a measurement source."
requires-python = ">=3.10"
dependencies = [
    "smplstream",
    "numpy>=1.24",
    "scipy>=1.10",
    "soundfile>=0.12",
]

# Two-tier model: installed via its OWN `uv tool install ./tools/smpl-ask` into an isolated venv
# (NOT the core workspace), discovered on PATH as `smpl-ask`, reachable through `smpl ask`.
# The Gemini backend is plain REST (urllib) so there is no provider SDK to isolate; a future
# local Qwen3-Omni / MOSS-Audio backend would add its heavy deps HERE behind an extra.
[project.scripts]
smpl-ask = "smpl_ask.cli:main"

[project.optional-dependencies]
local = []  # reserved: Qwen3-Omni / MOSS-Audio backend (stubbed, see smpl_ask.backends.LocalBackend)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smpl_ask"]

[tool.uv.sources]
smplstream = { path = "../../packages/smplstream", editable = true }
